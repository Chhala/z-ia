<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#0d0000"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Z-IA"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Z-IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- MODAL CLÉ API -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box">
    <p class="modal-title">Clé API requise</p>
    <p class="modal-desc">
      Obtiens ta clé gratuitement sur Google AI Studio,<br>
      puis colle-la ci-dessous pour accéder à l'assistant.
    </p>
    <input type="password" id="apiKeyInput" class="modal-input" placeholder="AIzaSy..." autocomplete="off"/>
    <p class="modal-error" id="modalError"></p>
    <p class="modal-link">
      <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com/app/apikey</a>
    </p>
    <button id="saveBtn" class="modal-btn">Déverrouiller</button>
  </div>
</div>

<!-- MENU PARAMÈTRES -->
<div id="settingsMenu" class="settings-menu hidden">
  <button class="settings-item" id="menuClear">Effacer l'écran</button>
  <div class="settings-divider"></div>
  <button class="settings-item" id="menuSound">Son : activé</button>
  <div class="settings-divider"></div>
  <button class="settings-item" id="menuDeleteKey">Supprimer la clé API</button>
  <div class="settings-divider"></div>
  <button class="settings-item settings-item--muted" id="menuAbout">
    Zombicide I-Agent — v1.0<span>Règles Zombicide 2e édition</span>
  </button>
</div>
<div id="settingsBackdrop" class="settings-backdrop hidden"></div>

<!-- APP -->
<div id="app" class="app hidden">
  <div class="bg-photo"></div>

  <button class="settings-btn" id="settingsBtn" aria-label="Paramètres">
    <span></span><span></span><span></span>
  </button>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="userInput" rows="1" maxlength="800"></textarea>
    </div>
    <button class="action-btn mode-mic" id="actionBtn" aria-label="Dicter ou envoyer">
      <!-- SVG swapped by JS -->
    </button>
  </div>
</div>

<audio id="ambientSound" src="undead-growl.mp3" preload="auto"></audio>

<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
